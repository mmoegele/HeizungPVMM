# Modern Heating System Configuration - FIXED VERSION with EVCC Integration
# ===========================================================================

# System Configuration
system:
  name: "Heating Controller"
  version: "2.0.0"

# Logging Configuration
logging:
  level: "INFO"
  log_file: "/var/log/heating/heating_system.log"
  audit_log: "/var/log/heating/audit.log"

# Temperature Settings
temperature:
  load_temperature: 40.0  # Base loading temperature in °C
  temperature_tolerance: 1.0  # Tolerance for temperature control
  charge_temperature_difference: 3.0  # Required temp difference for charging

# Buffer Loading Configuration
buffer_load:
  min_temperature_difference: 2.0  # Minimum temperature difference to start transfer (°C)
  hysteresis: 1.0                 # Hysteresis to prevent rapid cycling (°C)
  min_run_time: 60                # Minimum time pump runs once started (seconds)
  min_off_time: 120               # Minimum time pump stays off between runs (seconds)
  check_interval: 30              # How often to check temperatures (seconds)
  source_sensor: "puffer_k_mitte" # Source buffer temperature sensor
  target_sensor: "puffer_m_mitte" # Target buffer temperature sensor

# Safety Limits
safety:
  max_temperature: 85.0  # Maximum allowed temperature
  min_temperature: -20.0  # Minimum valid temperature

# Sensor Configuration
sensors:
  one_wire_mount_point: "/mnt/1wire"
  cache_duration_seconds: 2
  retry_attempts: 3
  retry_delay_seconds: 0.1
  
  # Temperature Sensor Mappings
  temperature_sensors:
    puffer_k_mitte:
      path: "/mnt/1wire/28.CBF849050000"
      description: "Konrad Buffer Middle"
      uuid: "474f6772-4189-43b6-b81d-82783f9ac929"
      
    puffer_k_rueck:
      path: "/mnt/1wire/28.04A449050000"
      description: "Konrad Buffer Return"
      uuid: "fd556815-fac7-4c49-af8b-da1736f39386"
      
    puffer_k_vorlauf:
      path: "/mnt/1wire/28.87264A050000"
      description: "Konrad Buffer Forward"
      uuid: "5aa7d4e8-bee2-479d-8d52-024a9aeec5b7"
      
    puffer_m_vorlauf:
      path: "/mnt/1wire/28.43914A050000"
      description: "Michael Buffer Forward"
      uuid: "6a48582e-5b2c-4310-850c-0236b9823989"
      
    puffer_m_mitte:
      path: "/mnt/1wire/28.CCDC49050000"
      description: "Michael Buffer Middle"
      uuid: "06ae8d39-5914-451d-abf6-9a9f41889ba7"
      
    puffer_m_rueck:
      path: "/mnt/1wire/28.8B024D050000"
      description: "Michael Buffer Return"
      uuid: "39aee5e8-010c-447b-b89a-4fce8eaa9f02"
      
    solar_vorlauf:
      path: "/mnt/1wire/28.76234B050000"
      description: "Solar Forward"
      uuid: "7a935d0f-2c04-4158-82ce-006295005c64"
      
    solar_ruecklauf:
      path: "/mnt/1wire/28.F0EA49050000"
      description: "Solar Return"
      uuid: "9ec9aaf0-c6ac-4b84-91de-50c563040837"
      
    bhkw_vorlauf:
      path: "/mnt/1wire/28.22F4AA040000"
      description: "BHKW Forward Temperature"
      uuid: "7cce5210-900a-4168-b455-5593c7be8554"
      
    mischer_fussboden:
      path: "/mnt/1wire/28.97A14A050000"
      description: "Floor Heating Mixer Temperature"
      uuid: "8d7e5f23-9c12-4b56-a891-d42e6f3a8b15"
      
    mischer_heizung:
      path: "/mnt/1wire/28.70204A050000"
      description: "Radiator Heating Mixer Temperature"
      uuid: "9f8e7d65-4321-4b56-a891-c31e5f2b7a04"

# HTTP Service Configuration
http_service:
  enable: true
  host: "0.0.0.0"
  port: 8080
  debug: false
  require_auth: false
  api_key: ""  # Will be auto-generated if empty
  rate_limit: "100 per hour"
  enable_cors: true
  dashboard_file: "dashboard.html"

# Hardware Configuration
hardware:
  piface:
    board_count: 2
  
  # Output Mappings
  outputs:
    puffer_lade_pumpe:
      board: 0
      port: 6
      description: "Buffer Charging Pump"
      
    mischer_1_auf:
      board: 0
      port: 1
      description: "Mixer 1 Open"
      
    mischer_1_zu:
      board: 0
      port: 0
      description: "Mixer 1 Close"
      
    mischer_2_auf:
      board: 0
      port: 4
      description: "Mixer 2 Open"
      
    mischer_2_zu:
      board: 0
      port: 3
      description: "Mixer 2 Close"
      
    wt_pumpe:
      board: 1
      port: 7
      description: "Heat Exchanger Pump"
      
    bhkw_start:
      board: 0
      port: 5
      description: "BHKW Start Signal"
      
    heizstab_1:
      board: 1
      port: 0
      description: "Heating Element 1"
      power_kw: 2.0
      
    heizstab_2:
      board: 1
      port: 1
      description: "Heating Element 2"
      power_kw: 2.0
      
    heizstab_3:
      board: 1
      port: 2
      description: "Heating Element 3"
      power_kw: 2.0

# Mixer Control Configuration
mixers:
  mixer_controllers:
    fussboden:
      sensor: "mischer_fussboden"
      max_temperature: 33.0
      auf_port: "mischer_1_auf"
      zu_port: "mischer_1_zu"
      
    heizung:
      sensor: "mischer_heizung"
      max_temperature: 52.0
      auf_port: "mischer_2_auf"
      zu_port: "mischer_2_zu"

# Heat Exchanger Configuration
heat_exchanger:
  target_temperature: 65.0  # Maximum desired temperature
  min_temperature: 50.0    # Minimum threshold temperature
  min_pump_interval: 0.15  # How long pump stays on in each cycle (seconds)
  max_interval: 1.0        # Maximum wait between cycles when cold (seconds)
  min_interval: 0.1        # Minimum wait between cycles when hot (seconds)
  control_interval: 1      # How often to check temperature (seconds)
  pump_port: "wt_pumpe"
  temperature_sensor: "bhkw_vorlauf"

# EVCC Integration Configuration
evcc:
  enable: true
  base_url: "http://192.168.191.45:7070"
  timeout: 10
  update_interval: 30
  min_battery_soc_for_heating: 50.0
  max_battery_soc_for_aggressive: 80.0
  max_temperature_for_heating: 70.0
  heating_thresholds:
    - 2000.0
    - 4000.0
    - 6000.0
  min_surplus_duration: 120
  heating_element_power: 2000.0
  turn_on_hysteresis: 200.0
  turn_off_hysteresis: 300.0
  cache_duration: 5

# Development Settings
development:
  demo_mode: true
  mock_hardware: true